name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # nix build runs the whole test suite in its checkPhase.
      - run: nix build -L
      - run: nix develop -c sh -c 'test -z "$(gofmt -l .)"'
      - run: nix develop -c go vet -tags sqlite_fts5,goolm ./...
